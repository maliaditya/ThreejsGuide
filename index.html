<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: 'Roboto', Arial, Helvetica, sans-serif;
            background-color: #1e1e1e;
            color: #d4d4d4;
            margin: 0;
            display: flex;
            justify-content: center;
            height: 100vh;
            overflow: auto;
        }

        #sidebar {
            margin-top: 30px;
            width: 280px;
            padding: 15px;
            border-right: 1px solid #3c3c3c;
            overflow-y: auto;
            height: 90%;
            position: relative;
            border-top-right-radius: 15px;
            border-bottom-right-radius: 15px;
            transition: transform 0.3s ease;
        }

        #sidebar.overlay {
            position: fixed;
            top: 0;
            left: 0;
            height: 100%;
            background-color: #1e1e1e;
            z-index: 2000;
            transform: translateX(-100%);
        }

        #sidebar.overlay.visible {
            transform: translateX(0);
        }

        #sidebar::-webkit-scrollbar {
            width: 8px;
        }

        #sidebar::-webkit-scrollbar-track {
            background: #2d2d2d;
        }

        #sidebar::-webkit-scrollbar-thumb {
            background: #444;
            border-radius: 4px;
        }

        #sidebar h3 {
            font-weight: bold;
            margin-bottom: 15px;
            color: #58a6ff;
        }

        .sidebar-tools {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
        }

        #file-search {
            flex: 1;
            min-width: 0;
            border: 1px solid #3f4652;
            background: #12161d;
            color: #d4d4d4;
            padding: 8px 10px;
            border-radius: 8px;
            font-size: 0.92rem;
            outline: none;
        }

        #file-search:focus {
            border-color: #4b8cff;
            box-shadow: 0 0 0 2px rgba(75, 140, 255, 0.2);
        }

        #clear-search {
            border: 1px solid #3f4652;
            background: #1f2630;
            color: #d4d4d4;
            border-radius: 8px;
            padding: 8px 10px;
            cursor: pointer;
            font-size: 0.82rem;
        }

        #clear-search:hover {
            background: #283140;
        }

        #file-search-empty {
            display: none;
            color: #9aa7b2;
            font-size: 0.9rem;
            padding: 8px 2px;
        }

        #sidebar a {
            display: flex;
            align-items: center;
            color: #ffffff;
            padding: 10px;
            text-decoration: none;
            border-radius: 8px;
            margin-bottom: 10px;
            font-weight: bold;
            background:linear-gradient(to right, #7800ff, #9a31ff);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        #sidebar a:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.5);
        }

        /* Guide sidebar grouped file styles (only filenames listed under groups) */
        .guide-group-header {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            padding: 8px 10px;
            border-radius: 8px;
            color: #e6eef6;
            transition: background 0.14s ease, transform 0.12s ease;
            margin-top: 8px;
            background: linear-gradient(180deg, rgba(255,255,255,0.01), rgba(255,255,255,0.00));
        }

        .guide-group-header:hover { background: rgba(255,255,255,0.03); transform: translateY(-1px); }

        .guide-group-header .caret {
            color: #9aa7b2;
            font-size: 12px;
            width: 12px;
            display: inline-block;
            text-align: center;
            transition: transform 0.18s ease;
        }

        .guide-group-header.open { background: rgba(255,255,255,0.01); }
        .guide-group-header.open .caret { transform: rotate(90deg); color: #6a11cb; }

        .guide-group-contents {
            padding-left: 8px;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.22s ease, opacity 0.18s ease;
            opacity: 0;
        }

        .guide-group-contents.open { max-height: 1000px; opacity: 1; }

        .guide-group-contents ul {
            list-style: none;
            margin: 6px 0 0 0;
            padding: 0;
            border-left: 1px solid rgba(255,255,255,0.03);
            padding-left: 12px;
        }

        .guide-group-contents li {
            margin-bottom: 6px;
        }

        .guide-group-contents a {
            color: #cfd6e0;
            font-size: 0.95em;
            text-decoration: none;
            padding: 6px 8px;
            display: block;
            border-radius: 6px;
            position: relative;
            transition: background 0.12s ease, color 0.12s ease;
            background: transparent;
        }

        .guide-group-contents a::before {
            content: '';
            position: absolute;
            left: -12px;
            top: 50%;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(255,255,255,0.03);
            transform: translateY(-50%);
            transition: background 0.12s ease;
        }

        /* hover: keep subtle, no full purple background */
        .guide-group-contents a:hover { background: transparent; color: #ffffff; }

        /* only active file gets the purple gradient */
        .guide-group-contents a.active {
            background: linear-gradient(90deg, #6a11cb, #2575fc);
            color: #ffffff;
            font-weight: 700;
            padding-left: 10px;
            padding-right: 14px;
        }

        .guide-group-contents a.active::before { background: #6a11cb; box-shadow: 0 0 8px rgba(106,17,203,0.18); }

        /* small temporary highlight for scrolled-to header */
        .preview-highlight {
            box-shadow: inset 0 -4px 0 0 rgba(106,17,203,0.3);
            transition: box-shadow 0.4s ease;
        }

        #content {
            margin: 0;
            padding: 30px;
            flex: 1;
            overflow-y: auto;
            max-width: 1000px;
            display: flex;
            flex-direction: column;
        }

        #content::-webkit-scrollbar {
            width: 8px;
        }

        #content::-webkit-scrollbar-track {
            background: #1e1e1e;
        }

        #content::-webkit-scrollbar-thumb {
            background: #444;
            border-radius: 4px;
        }

        /* Global scrollbar styling to ensure consistent dark appearance */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1e1e1e;
        }
        ::-webkit-scrollbar-thumb {
            background: #444;
            border-radius: 4px;
        }
        /* Firefox */
        html, body, #sidebar, #toc-sidebar, #slide-view {
            scrollbar-width: thin;
            scrollbar-color: #444 #1e1e1e;
        }

        /* Subtle sidebar separators: make them darker and less contrasty */
        #sidebar { border-right: 1px solid rgba(255,255,255,0.03); }
        #toc-sidebar { border-left: 1px solid rgba(255,255,255,0.03); }

        .preview-container {
            position: relative;
            border-radius: 50px;
            padding: 2px;
        }

        .preview-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border-radius: 25px;
            padding: 2px;
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        #preview {
            position: relative;
            border-radius: 8px;
            background-color: #1e1e1e;
            padding: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            color: #d4d4d4;
            overflow: hidden;
        }

        #preview.is-loading {
            min-height: 180px;
        }

        .preview-status {
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.02);
            color: #c8d3de;
            padding: 14px 16px;
            margin-bottom: 12px;
        }

        .preview-status.error {
            border-color: rgba(255, 85, 85, 0.4);
            background: rgba(255, 85, 85, 0.08);
            color: #ffb6b6;
        }

        #preview img {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 0 auto;
            border-radius: 8px;
        }

        h1, h2, h3, h4, h5, h6 {
            background: linear-gradient(to right, #6a11cb, #2575fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        a {
            color: #56b6c2;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        code {
            background: #673ab7;
            color: #F8F8F2;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 1em;
            font-family: 'Courier New', Courier, monospace;
            display: inline-block;
        }

        pre {
            background-color: #2D2D2D;
            color: #F8F8F2;
            border-radius: 8px;
            overflow-x: auto;
            border: 1px solid #44475a;
            font-size: 0.98em;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.4);
        }

        .token.comment,
        .token.prolog,
        .token.doctype,
        .token.cdata {
            color: #6272a4;
        }

        .token.punctuation {
            color: #f8f8f2;
        }

        .token.property,
        .token.tag,
        .token.constant,
        .token.symbol,
        .token.deleted {
            color: #ff79c6;
        }

        .token.boolean,
        .token.number {
            color: #bd93f9;
        }

        .token.selector,
        .token.attr-name,
        .token.string,
        .token.char,
        .token.builtin,
        .token.inserted {
            color: #50fa7b;
        }

        .token.operator,
        .token.entity,
        .token.url,
        .language-css .token.string,
        .style .token.string {
            color: #f1fa8c;
        }

        .token.atrule,
        .token.attr-value,
        .token.keyword {
            color: #8be9fd;
        }

        .token.function,
        .token.class-name {
            color: #66d9ef;
        }

        .token.regex,
        .token.important,
        .token.variable {
            color: #ffb86c;
        }

        .token.important,
        .token.bold {
            font-weight: bold;
        }

        .token.italic {
            font-style: italic;
        }

        .token.entity {
            cursor: help;
        }

        #toc-sidebar {
            margin-top: 30px;
            width: 280px;
            padding: 15px;
            border-left: 1px solid #3c3c3c;
            overflow-y: auto;
            height: fit-content;
            position: relative;
            border-top-left-radius: 15px;
            border-bottom-left-radius: 15px;
            margin-left: 20px;
            transition: transform 0.3s ease;
        }

        #toc-sidebar.overlay {
            position: fixed;
            top: 0;
            right: 0;
            height: 100%;
            background-color: #1e1e1e;
            z-index: 2000;
            transform: translateX(100%);
        }

        #toc-sidebar.overlay.visible {
            transform: translateX(0);
        }

        #toc-sidebar h3 {
            font-weight: bold;
            margin-bottom: 15px;
            color: #58a6ff;
        }

        #toc-sidebar a {
            display: block;
            color: #d4d4d4;
            padding: 8px 15px;
            text-decoration: none;
            border-radius: 5px;
            margin-bottom: 5px;
            font-weight: 500;
            transition: background-color 0.3s ease;
        }

        #toc-sidebar a:hover {
            background-color: #3c3c3c;
        }

        #toc-sidebar a.active {
            background-color: #6a11cb;
            color: #ffffff;
        }

        /* Nested TOC styling (tightened) - dots removed, lines kept */
        #toc-list { position: relative; }
        #toc-list ul {
            list-style: none;
            margin: 0;
            padding-left: 0;
            position: relative;
        }

        /* reduce overall left spacing so connectors sit close to text */
        #toc-list li {
            margin-bottom: 6px;
            position: relative;
            padding-left: 12px; /* tightened */
        }

        /* vertical connector line for nested lists (thinner & closer) */
        #toc-list ul ul::before {
            content: '';
            position: absolute;
            left: 7px;
            top: 8px;
            bottom: 8px;
            width: 1px;
            background: rgba(255,255,255,0.03);
            border-radius: 1px;
        }

        /* remove circular dots - keep clean lines only */
        #toc-list li::before {
            display: none;
        }

        /* completed-toggle area (small, invisible button that sits over the dot) */
        .toc-complete-toggle {
            position: absolute;
            left: 2px;
            top: 50%;
            transform: translateY(-50%);
            width: 12px;
            height: 12px;
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 0;
        }

        /* small dot for each item (now visible) */
        #toc-list li::before {
            content: '';
            position: absolute;
            left: 6px;
            top: 50%;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(255,255,255,0.06);
            transform: translateY(-50%);
            transition: background-color 0.12s ease, transform 0.12s ease, box-shadow 0.12s ease;
        }

        /* smaller dots for nested levels */
        #toc-list ul ul li::before {
            width: 5px;
            height: 5px;
            left: 5px;
            background: rgba(255,255,255,0.05);
        }

        #toc-list ul ul ul li::before {
            width: 4px;
            height: 4px;
            left: 9px;
            background: rgba(255,255,255,0.04);
        }

        /* completed shows a small green check in place of the dot */
        #toc-list li.completed::before {
            width: 10px;
            height: 10px;
            left: 3px;
            background: #10b981 url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23ffffff'><path d='M20.285 6.709l-11.025 11.02-5.545-5.546 1.414-1.414 4.131 4.132 9.611-9.618z'/></svg>") no-repeat center / 10px 10px;
            border-radius: 50%;
            box-shadow: 0 0 6px rgba(16,185,129,0.18);
            transform: translateY(-50%) scale(1.02);
        }

        /* add a subtle horizontal active indicator aligned with each item */
        #toc-list li::after {
            content: '';
            position: absolute;
            left: 20px;
            top: 50%;
            width: 0;
            height: 2px;
            background: transparent;
            transform: translateY(-50%);
            transition: width 0.12s ease, background 0.12s ease;
            border-radius: 2px;
        }

        #toc-list li.active::after {
            width: 10px;
            background: #6a11cb;
            box-shadow: 0 0 6px rgba(106,17,203,0.22);
        }

        /* show L-branch for items that have children */
        #toc-list li.has-children > a::before {
            content: '';
            position: absolute;
            left: 12px;
            top: 50%;
            width: 10px;
            height: 1px;
            background: rgba(255,255,255,0.03);
            transform: translateY(-50%);
        }

        #toc-list li a {
            display: block;
            color: #d4d4d4;
            padding: 6px 8px; /* tightened */
            text-decoration: none;
            border-radius: 5px;
            font-weight: 500;
            transition: background-color 0.15s ease;
        }

        #toc-list li a:hover {
            background-color: #3c3c3c;
        }

        /* nested connector adjustments */
        #toc-list ul ul::before {
            left: 11px;
        }

        #toc-list ul ul li a {
            padding-left: 18px;
            font-size: 0.95em;
            color: #cfd6e0;
        }

        #toc-list ul ul ul::before {
            left: 15px;
            background: rgba(255,255,255,0.02);
        }

        #toc-list ul ul ul li a {
            padding-left: 28px;
            font-size: 0.9em;
            color: #bfc8d8;
        }

        /* completed state visuals */
        #toc-list li.completed > a {
            opacity: 0.95;
            color: #dff7ea;
        }

        /* active link styles (for li.active) */
        #toc-list li.active > a {
            background-color: #6a11cb;
            color: #ffffff;
        }

        /* Slides button */
        .slides-btn {
            position: fixed;
            right: 20px;
            bottom: 20px;
            z-index: 4000;
            background: linear-gradient(90deg, #0ea5e9, #3b82f6);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.2);
            padding: 11px 16px;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 10px 26px rgba(0,0,0,0.38);
            font-weight: 700;
            transition: transform 0.18s ease, box-shadow 0.18s ease, filter 0.18s ease;
        }

        .slides-btn:hover {
            transform: translateY(-2px);
            filter: brightness(1.05);
            box-shadow: 0 14px 28px rgba(0,0,0,0.42);
        }

        .slides-btn.active {
            background: linear-gradient(90deg, #0ea5e9, #14b8a6);
        }

        .studio-btn {
            position: fixed;
            left: 20px;
            bottom: 20px;
            z-index: 4000;
            background: linear-gradient(90deg, #14b8a6, #06b6d4);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.22);
            padding: 11px 16px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 700;
            box-shadow: 0 10px 26px rgba(0,0,0,0.38);
        }

        .studio-overlay {
            position: fixed;
            inset: 0;
            background: #020617;
            z-index: 7000;
            display: none;
            padding: 10px;
        }

        .studio-overlay.open {
            display: block;
        }

        .studio-modal {
            width: 100%;
            height: 100%;
            background: #0b1220;
            border: 1px solid rgba(148,163,184,0.28);
            border-radius: 14px;
            color: #e2e8f0;
            display: grid;
            grid-template-rows: auto 1fr auto;
            overflow: hidden;
            font-size: 16px;
        }

        .studio-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding: 12px 14px;
            border-bottom: 1px solid rgba(148,163,184,0.2);
            background: linear-gradient(180deg, rgba(15,23,42,0.95), rgba(15,23,42,0.75));
        }

        .studio-title {
            font-size: 1.2rem;
            font-weight: 700;
            margin: 0;
        }

        .studio-body {
            display: grid;
            grid-template-columns: 440px 1fr;
            min-height: 0;
        }

        .studio-left {
            border-right: 1px solid rgba(148,163,184,0.2);
            padding: 14px;
            overflow: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .studio-left .studio-grid {
            grid-template-columns: 1fr;
            gap: 8px;
        }

        .studio-left .studio-actions {
            gap: 8px;
            flex-wrap: wrap;
        }

        .studio-left .studio-actions button {
            flex: 1 1 140px;
        }

        .studio-section-card {
            border: 1px solid rgba(148,163,184,0.18);
            background: rgba(15,23,42,0.42);
            border-radius: 10px;
            padding: 10px;
        }

        .studio-section-title {
            margin: 0 0 8px 0;
            font-size: 0.82rem;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: #93c5fd;
            font-weight: 700;
        }

        .studio-section-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 8px;
        }

        .studio-section-toggle {
            border: 1px solid rgba(148,163,184,0.28);
            background: #0f172a;
            color: #cbd5e1;
            border-radius: 8px;
            padding: 6px 10px;
            cursor: pointer;
            font-size: 0.82rem;
            font-weight: 600;
        }

        .project-settings-section .project-advanced {
            margin-top: 10px;
        }

        .project-settings-section.collapsed .project-advanced {
            display: none;
        }

        .studio-right {
            display: grid;
            grid-template-rows: auto auto minmax(0, 1fr);
            gap: 12px;
            padding: 14px;
            min-height: 0;
            align-content: start;
        }

        .studio-right > .studio-field {
            min-height: 0;
            height: 100%;
        }

        .studio-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .studio-field {
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-size: 0.96rem;
            color: #cbd5e1;
        }

        .studio-field input,
        .studio-field select,
        .studio-field textarea {
            border: 1px solid rgba(148,163,184,0.28);
            background: #111827;
            color: #e2e8f0;
            border-radius: 8px;
            padding: 10px 12px;
            font-size: 1rem;
            outline: none;
        }

        .studio-field textarea {
            min-height: 72px;
            resize: vertical;
        }

        #studio-markdown-editor {
            width: 100%;
            min-height: 620px;
            height: 100%;
            resize: none;
            font-family: Consolas, "Courier New", monospace;
            font-size: 1rem;
            line-height: 1.5;
            min-width: 0;
        }

        .studio-editor-split {
            display: grid;
            grid-template-columns: minmax(420px, 1fr) minmax(420px, 1fr);
            gap: 12px;
            min-height: 0;
            height: 100%;
            align-items: stretch;
        }

        .studio-editor-pane,
        .studio-preview-pane {
            display: flex;
            flex-direction: column;
            min-height: 0;
            min-width: 0;
            overflow: hidden;

    <script>
        function getFileFromUrl() {
            const hash = window.location.hash || '';
            const m = hash.match(/file=([^&]+)/);
            if (!m) return null;
            try {
                return decodeURIComponent(m[1]);
            } catch {
                return null;
            }
        }
        const LAST_FILE_KEY = 'guideLastFile';
        const STUDIO_CONFIG_KEY = 'guideStudioConfig';
        const STUDIO_CONTENT_KEY = 'guideStudioContent';
        const PROJECT_SETTINGS_COLLAPSED_KEY = 'studioProjectSettingsCollapsed';
        const DEFAULT_STUDIO_AUTH = {
            enabled: false,
            supabaseUrl: '',
            supabaseAnonKey: '',
            allowedEmail: ''
        };
        const DEFAULT_GITHUB_PUBLISH = {
            enabled: false,
            apiUrl: '/api/github/publish'
        };
        let appConfig = {};
        let studioContentMap = {};
        let studioVisualEditEnabled = false;
        let studioPreviewSyncTimer = null;
        let studioSupabaseClient = null;
        let studioSupabaseFingerprint = '';
        let studioAuthModalResolver = null;
        let currentMarkdownRaw = '';
        let liveVisualEditEnabled = false;
        let livePreviewSyncTimer = null;

        function cloneJson(data) {
            return JSON.parse(JSON.stringify(data));
        }

        function getStoredJson(key, fallback) {
            try {
                const raw = localStorage.getItem(key);
                if (!raw) return fallback;
                return JSON.parse(raw);
            } catch (e) {
                return fallback;
            }
        }

        function setStoredJson(key, value) {
            try {
                localStorage.setItem(key, JSON.stringify(value));
            } catch (e) {}
        }

        function getStoredBool(key, fallback) {
            try {
                const raw = localStorage.getItem(key);
                if (raw === null || raw === undefined) return fallback;
                return raw === 'true';
            } catch (e) {
                return fallback;
            }
        }

        function downloadTextFile(fileName, text, contentType = 'text/plain') {
            const blob = new Blob([text], { type: `${contentType};charset=utf-8` });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = fileName;
            document.body.appendChild(a);
            a.click();
            a.remove();
            URL.revokeObjectURL(url);
        }

        function sanitizeConfigShape(config) {
            const cfg = cloneJson(config || {});
            if (!Array.isArray(cfg.markdownFiles)) cfg.markdownFiles = [];
            cfg.markdownFiles = cfg.markdownFiles.map((g) => ({
                group: g.group || 'New Group',
                path: g.path || '',
                sequence: Number.isFinite(Number(g.sequence)) ? Number(g.sequence) : undefined,
                files: Array.isArray(g.files) ? g.files : []
            }));
            if (!cfg.utterances || typeof cfg.utterances !== 'object') cfg.utterances = {};
            cfg.studioAuth = Object.assign({}, DEFAULT_STUDIO_AUTH, cfg.studioAuth || {});
            cfg.githubPublish = Object.assign({}, DEFAULT_GITHUB_PUBLISH, cfg.githubPublish || {});
            return cfg;
        }

        function getStudioAuthConfig() {
            return Object.assign({}, DEFAULT_STUDIO_AUTH, (appConfig && appConfig.studioAuth) || {});
        }

        function getGitHubPublishConfig() {
            return Object.assign({}, DEFAULT_GITHUB_PUBLISH, (appConfig && appConfig.githubPublish) || {});
        }

        function toRepoRelativePath(path) {
            let p = (path || '').trim();
            if (!p) return '';
            p = p.replace(/\\/g, '/');
            p = p.replace(/^\.\/+/, '');
            p = p.replace(/^\/+/, '');
            return p;
        }

        function buildPublishPayload(resolvedPath, markdownText) {
            const filePath = toRepoRelativePath(resolvedPath);
            if (!filePath) return null;
            return {
                message: `Studio publish: ${filePath}`,
                files: [
                    {
                        path: 'config.json',
                        content: JSON.stringify(sanitizeConfigShape(appConfig), null, 2)
                    },
                    {
                        path: filePath,
                        content: markdownText || ''
                    }
                ]
            };
        }

        async function publishStudioToGitHub(resolvedPath, markdownText) {
            const cfg = getGitHubPublishConfig();
            if (!cfg.enabled) {
                return { ok: false, skipped: true, reason: 'GitHub publish is disabled in config.githubPublish.enabled' };
            }
            const apiUrl = (cfg.apiUrl || '').trim();
            if (!apiUrl) {
                return { ok: false, skipped: true, reason: 'Missing config.githubPublish.apiUrl' };
            }
            const payload = buildPublishPayload(resolvedPath, markdownText);
            if (!payload) {
                return { ok: false, skipped: true, reason: 'Could not build publish payload' };
            }

            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const body = await response.json().catch(() => ({}));
                if (!response.ok || !body.ok) {
                    return {
                        ok: false,
                        skipped: false,
                        reason: (body && body.error) || `GitHub publish failed (HTTP ${response.status})`
                    };
                }
                return { ok: true, details: body };
            } catch (err) {
                return {
                    ok: false,
                    skipped: false,
                    reason: `Cannot reach publish server at ${apiUrl}. Start github-publish-server.mjs.`
                };
            }
        }

        function isAllowedStudioUser(userEmail, allowedEmail) {
            const actual = (userEmail || '').trim().toLowerCase();
            const allowed = (allowedEmail || '').trim().toLowerCase();
            if (!allowed) return !!actual;
            return actual === allowed;
        }

        function getStudioSupabaseClient(cfg) {
            const url = (cfg.supabaseUrl || '').trim();
            const key = (cfg.supabaseAnonKey || '').trim();
            if (!url || !key) return null;
            const fp = `${url}::${key.slice(0, 8)}`;
            if (studioSupabaseClient && studioSupabaseFingerprint === fp) return studioSupabaseClient;
            if (!window.supabase || typeof window.supabase.createClient !== 'function') return null;
            studioSupabaseClient = window.supabase.createClient(url, key);
            studioSupabaseFingerprint = fp;
            return studioSupabaseClient;
        }

        function setStudioAuthModalOpen(open) {
            const overlay = document.getElementById('studio-auth-overlay');
            if (!overlay) return;
            overlay.classList.toggle('open', !!open);
            overlay.setAttribute('aria-hidden', open ? 'false' : 'true');
        }

        function showStudioAuthModal(options = {}) {
            const overlay = document.getElementById('studio-auth-overlay');
            const form = document.getElementById('studio-auth-form');
            const emailInput = document.getElementById('studio-auth-email');
            const passwordInput = document.getElementById('studio-auth-password');
            const errorEl = document.getElementById('studio-auth-error');
            const subtitleEl = document.getElementById('studio-auth-subtitle');
            const cancelBtn = document.getElementById('studio-auth-cancel');
            if (!overlay || !form || !emailInput || !passwordInput || !errorEl || !subtitleEl || !cancelBtn) {
                return Promise.resolve(null);
            }

            emailInput.value = options.email || '';
            passwordInput.value = '';
            subtitleEl.textContent = options.subtitle || 'Sign in to continue.';
            errorEl.textContent = options.error || '';
            setStudioAuthModalOpen(true);
            setTimeout(() => emailInput.focus(), 0);

            return new Promise((resolve) => {
                const finish = (value) => {
                    if (!studioAuthModalResolver) return;
                    studioAuthModalResolver = null;
                    form.onsubmit = null;
                    cancelBtn.onclick = null;
                    overlay.onkeydown = null;
                    setStudioAuthModalOpen(false);
                    resolve(value);
                };

                studioAuthModalResolver = finish;
                form.onsubmit = (e) => {
                    e.preventDefault();
                    const email = (emailInput.value || '').trim();
                    const password = passwordInput.value || '';
                    if (!email || !password) {
                        errorEl.textContent = 'Email and password are required.';
                        return;
                    }
                    finish({ email, password });
                };
                cancelBtn.onclick = () => finish(null);
                overlay.onkeydown = (e) => {
                    if (e.key === 'Escape') finish(null);
                };
            });
        }

        async function ensureStudioAuthenticated() {
            const cfg = getStudioAuthConfig();
            if (!cfg.enabled) {
                updateLiveEditDockVisibility();
                return true;
            }

            const client = getStudioSupabaseClient(cfg);
            if (!client) {
                await showStudioAuthModal({
                    subtitle: 'Studio auth is enabled but Supabase config is missing.',
                    error: 'Add studioAuth.supabaseUrl and studioAuth.supabaseAnonKey in config.json.'
                });
                return false;
            }

            const sessionResult = await client.auth.getSession();
            const sessionUser = sessionResult && sessionResult.data && sessionResult.data.session && sessionResult.data.session.user;
            if (sessionUser && isAllowedStudioUser(sessionUser.email, cfg.allowedEmail)) {
                updateLiveEditDockVisibility();
                return true;
            }

            if (sessionUser && !isAllowedStudioUser(sessionUser.email, cfg.allowedEmail)) {
                await client.auth.signOut();
            }

            let previousEmail = '';
            let errorText = '';
            while (true) {
                const credentials = await showStudioAuthModal({
                    email: previousEmail,
                    subtitle: 'Sign in to open Guide Studio.',
                    error: errorText
                });
                if (!credentials) return false;
                previousEmail = credentials.email;

                const signInResult = await client.auth.signInWithPassword({
                    email: credentials.email,
                    password: credentials.password
                });
                if (signInResult.error || !signInResult.data || !signInResult.data.user) {
                    errorText = 'Login failed. Check email/password and try again.';
                    continue;
                }

                const loggedInEmail = signInResult.data.user.email || '';
                if (!isAllowedStudioUser(loggedInEmail, cfg.allowedEmail)) {
                    await client.auth.signOut();
                    errorText = `Access denied. Allowed account: ${cfg.allowedEmail}`;
                    continue;
                }
                updateLiveEditDockVisibility();
                return true;
            }
        }

        function getSavedLastFile() {
            try {
                return localStorage.getItem(LAST_FILE_KEY) || null;
            } catch (e) {
                return null;
            }
        }

        function saveLastFile(filePath) {
            if (!filePath) return;
            try {
                localStorage.setItem(LAST_FILE_KEY, filePath);
            } catch (e) {}
        }

        function getAllResolvedFiles() {
            const files = [];
            for (const group of sortGroups(appConfig.markdownFiles || [])) {
                const gp = group.path
                    ? (group.path.endsWith('/') ? group.path.slice(0, -1) : group.path)
                    : '';
                for (const f of sortLessonFiles(group.files || [])) {
                    files.push(gp ? `${gp}/${f.fileName}` : f.fileName);
                }
            }
            return files;
        }

        function setPreviewStatus(message, isError = false) {
            const preview = document.getElementById('preview');
            if (!preview) return;
            preview.classList.add('is-loading');
            preview.innerHTML = `<div class="preview-status${isError ? ' error' : ''}">${message}</div>`;
        }

        function resolveDefaultMarkdown(cfg, name) {
            if (!name) return null;

            // Already a path → use directly
            if (name.includes('/') || name.startsWith('./') || name.startsWith('../')) {
                return name;
            }

            // Resolve from config file list
            for (const group of (cfg.markdownFiles || [])) {
                const gp = group.path
                    ? (group.path.endsWith('/') ? group.path.slice(0, -1) : group.path)
                    : '';

                for (const f of (group.files || [])) {
                    if (f.fileName === name || f.displayName === name) {
                        return gp ? `${gp}/${f.fileName}` : f.fileName;
                    }
                }
            }

            return name;
        }

        async function loadConfig() {
            try {
                const response = await fetch('config.json');
                if (!response.ok) {
                    throw new Error('Failed to load config.json');
                }

                const rawConfig = await response.json();
                const savedConfig = getStoredJson(STUDIO_CONFIG_KEY, null);
                const mergedConfig = Object.assign({}, rawConfig || {}, savedConfig || {});
                // Security source of truth: always take studioAuth from config.json
                if (rawConfig && rawConfig.studioAuth) {
                    mergedConfig.studioAuth = rawConfig.studioAuth;
                }
                // Deployment source of truth: always take githubPublish from config.json
                if (rawConfig && rawConfig.githubPublish) {
                    mergedConfig.githubPublish = rawConfig.githubPublish;
                }
                const config = sanitizeConfigShape(mergedConfig);
                studioContentMap = getStoredJson(STUDIO_CONTENT_KEY, {});
                appConfig = config;
                applyConfig(config);
                initStudioUi();

                const fileFromUrl = getFileFromUrl();
                const savedLastFile = getSavedLastFile();
                const allFiles = getAllResolvedFiles();
                const isSavedFileValid = savedLastFile && allFiles.includes(savedLastFile);

                if (fileFromUrl) {
                    loadMarkdownFile(fileFromUrl);
                } else if (isSavedFileValid) {
                    loadMarkdownFile(savedLastFile);
                } else {
                    const resolvedDefault = resolveDefaultMarkdown(config, config.default_markdown);
                    if (resolvedDefault) {
                        loadMarkdownFile(resolvedDefault);
                    }
                }
            } catch (error) {
                console.error('Error loading config:', error);
            }
        }


        function applyConfig(config) {
            appConfig = sanitizeConfigShape(config);
            if (appConfig.mediaPath) {
                appConfig.mediaPath = appConfig.mediaPath.replace(/\/+$/, '');

        function resolveFilePath(groupPath, fileName) {
            if (!groupPath) return fileName;
            const gp = groupPath.endsWith('/') ? groupPath.slice(0, -1) : groupPath;
            const fn = fileName.startsWith('/') ? fileName.slice(1) : fileName;
            return gp + '/' + fn;
        }

        function getGroupSequenceValue(group) {
            if (group && Number.isFinite(Number(group.sequence))) return Number(group.sequence);
            const name = (group && group.group ? String(group.group) : '').trim();
            const m = name.match(/^(\d+)[\s.\-_:)]*/);
            if (m) return Number(m[1]);
            return Number.POSITIVE_INFINITY;
        }

        function sortGroups(groups) {
            return (groups || []).slice().sort((a, b) => {
                const sa = getGroupSequenceValue(a);
                const sb = getGroupSequenceValue(b);
                if (sa !== sb) return sa - sb;
                const ga = String((a && a.group) || '');
                const gb = String((b && b.group) || '');
                return ga.localeCompare(gb, undefined, { numeric: true, sensitivity: 'base' });
            });
        }

        function getLessonSequenceValue(file) {
            if (file && Number.isFinite(Number(file.sequence))) {
                return Number(file.sequence);
            }
            const name = (file && file.displayName ? String(file.displayName) : '').trim();
            const m = name.match(/^(\d+)[\s.\-_:)]*/);
            if (m) return Number(m[1]);
            return Number.POSITIVE_INFINITY;
        }

        function sortLessonFiles(files) {
            return (files || []).slice().sort((a, b) => {
                const sa = getLessonSequenceValue(a);
                const sb = getLessonSequenceValue(b);
                if (sa !== sb) return sa - sb;
                const da = String((a && (a.displayName || a.fileName)) || '');
                const db = String((b && (b.displayName || b.fileName)) || '');
                return da.localeCompare(db, undefined, { numeric: true, sensitivity: 'base' });
            });
        }

            if (!filePath) return '';

        function getSavedGroups() {
            try {
                return JSON.parse(localStorage.getItem('guideGroups') || '{}');
            } catch (e) { return {}; }
        }
        function saveGroups(obj) {

        function loadMarkdownFiles(markdownFiles) {
            const fileListElement = document.getElementById('file-list');
            fileListElement.innerHTML = '';

            const saved = getSavedGroups();

            // Support grouped format: [{ group: 'Basics', files: [...] }, ...]
            if (markdownFiles.length && markdownFiles[0].group && Array.isArray(markdownFiles[0].files)) {
                sortGroups(markdownFiles).forEach(group => {
                    const groupHeader = document.createElement('div');
                    groupHeader.className = 'guide-group-header';

                    const caret = document.createElement('span');
                    caret.className = 'caret';
                    caret.textContent = '▸';
                    groupHeader.appendChild(caret);

                    const title = document.createElement('span');
                    title.textContent = group.group;
                    groupHeader.appendChild(title);

                    const groupContents = document.createElement('div');
                    groupContents.className = 'guide-group-contents';
                    const ul = document.createElement('ul');

                    sortLessonFiles(group.files || []).forEach(file => {
                        ul.appendChild(buildFileListItem(file, group.path || ''));
                    });

                    groupContents.appendChild(ul);

                    // restore saved state
                    const isOpenSaved = !!saved[group.group];
                    if (isOpenSaved) {
                        groupContents.classList.add('open');
                        groupHeader.classList.add('open');
                        caret.textContent = '▾';
                    }

                    // toggle expansion when header clicked
                    groupHeader.addEventListener('click', () => {
                        const isOpen = groupContents.classList.toggle('open');
                        groupHeader.classList.toggle('open', isOpen);
                        caret.textContent = isOpen ? '▾' : '▸';
                        // persist
                        const obj = getSavedGroups();
                        obj[group.group] = isOpen;
                        saveGroups(obj);
                    });

                    fileListElement.appendChild(groupHeader);
                    fileListElement.appendChild(groupContents);
                });
                const search = document.getElementById('file-search');
                if (search && search.value) {
                    filterGuideFiles(search.value);
                }
                return;
            }

            // fallback: flat list of files (no subtopics)
            const ul = document.createElement('ul');
            markdownFiles.forEach(file => {
                ul.appendChild(buildFileListItem(file));
            });
            fileListElement.appendChild(ul);

            const search = document.getElementById('file-search');
            if (search && search.value) {
                filterGuideFiles(search.value);
            }
        }

        function filterGuideFiles(rawQuery) {
            const query = (rawQuery || '').trim().toLowerCase();
            const links = Array.from(document.querySelectorAll('.guide-file-link'));
            const emptyState = document.getElementById('file-search-empty');
            let visibleCount = 0;

            links.forEach((link) => {
                const label = (link.textContent || '').toLowerCase();
                const matches = !query || label.includes(query);
                const li = link.closest('li');
                if (li) li.style.display = matches ? '' : 'none';
                if (matches) visibleCount++;
            });

            const groups = Array.from(document.querySelectorAll('.guide-group-header'));
            groups.forEach((header) => {
                const contents = header.nextElementSibling;
                if (!contents || !contents.classList.contains('guide-group-contents')) return;
                const hasVisible = !!contents.querySelector('li:not([style*="display: none"])');
                header.style.display = hasVisible ? '' : 'none';
                contents.style.display = hasVisible ? '' : 'none';
                if (query && hasVisible) contents.classList.add('open');
            });

            if (emptyState) {
                emptyState.style.display = visibleCount > 0 ? 'none' : 'block';
            }
        }

        function navigateRelativeFile(step) {
            const files = getAllResolvedFiles();
            if (!files.length) return;

            const current = getFileFromUrl() || getSavedLastFile() || files[0];
            let index = files.indexOf(current);
            if (index < 0) index = 0;
            index = (index + step + files.length) % files.length;
            loadMarkdownFile(files[index]);
