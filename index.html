        async function loadMarkdownFile(fileName, anchorText = null) {
            try {
                setPreviewStatus('Loading lesson...');
                let text = null;
                if (Object.prototype.hasOwnProperty.call(studioContentMap, fileName)) {
                    text = studioContentMap[fileName] || '';
                } else {
                    const response = await fetch(fileName);
                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }
                    text = await response.text();
                }
                currentMarkdownRaw = text || '';
                renderMarkdown(text, fileName);
                const preview = document.getElementById('preview');
                if (preview) preview.classList.remove('is-loading');
                // highlight active file in Guide
                highlightActiveFile(fileName);
                saveLastFile(fileName);
                // update the page header/title to reflect the current file
                setCurrentPageHeader(fileName);
                // load utterances comments scoped to this file (so each file has its own comment thread)
                loadUtterancesForFile(fileName);

                // after render, if an anchor (heading text) was provided, scroll to it
                if (anchorText) {
                    // small timeout to ensure ids are applied
                    setTimeout(() => {
                        const headers = Array.from(document.getElementById('preview').querySelectorAll('h1, h2, h3, h4, h5, h6'));
                        const target = headers.find(h => h.textContent.trim() === anchorText.trim());
                        if (target) {
                            target.scrollIntoView({ behavior: 'smooth' });
                            // note: no visual highlight on the content heading — only the file name in the Guide is highlighted
                        }
                    }, 40);
                }
            } catch (error) {
                console.error('Error loading markdown file:', error);
                setPreviewStatus(`Could not load "${fileName}".`, true);
            }
        }

        function renderMarkdown(markdownText, currentFile = '') {
            // rewrite Obsidian-style embeds (![[file]]) and resolve image paths using appConfig.mediaPath
            function rewriteImagePaths(mdText) {
                let text = mdText;
                const mediaRoot = (appConfig && appConfig.mediaPath) ? appConfig.mediaPath.replace(/\/+$/, '') : null;

                // Obsidian embed syntax: ![[File name.png]] or ![[Media/File name.png]]
                text = text.replace(/!\[\[([^\]]+)\]\]/g, (m, inner) => {
                    let path = inner.split('|')[0].trim();
                    // remove leading slashes
                    path = path.replace(/^\/+/, '');
                    const src = mediaRoot ? (mediaRoot + '/' + encodeURI(path)) : encodeURI(path);
                    return '![](' + src + ')';
                });

                // Standard markdown images: ![alt](src)
                text = text.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, (m, alt, src) => {
                    src = src.trim();
                    if (src.startsWith('<') && src.endsWith('>')) src = src.slice(1, -1);
                    // leave absolute URLs, data URLs, and rooted/relative paths alone
                    if (/^(?:https?:|data:|\/|\.\.|\.\/)/i.test(src) || src.includes(':')) {
                        return '![' + alt + '](' + src + ')';
                    }
                    // otherwise, prefix with mediaRoot if available
                    if (mediaRoot) {
                        const newSrc = mediaRoot + '/' + src;
                        return '![' + alt + '](' + encodeURI(newSrc) + ')';
                    }
                    return m;
                });

                return text;
            }

            function rewriteYouTubeEmbeds(mdText) {
                let text = mdText;
                const originParam = encodeURIComponent(window.location.origin || window.location.href);
                function extractId(url) {
                    try {
                        const u = new URL(url);
                        if (u.hostname.includes('youtu.be')) {
                            return u.pathname.slice(1).split(/[?#]/)[0];
                        }
                        if (u.hostname.includes('youtube.com')) {
                            return u.searchParams.get('v');
                        }
                    } catch (e) {
                        const m = url.match(/(?:v=|youtu\.be\/)([A-Za-z0-9_-]{11})/);
                        return m && m[1];
                    }
                    const m = url.match(/(?:v=|youtu\.be\/)([A-Za-z0-9_-]{11})/);
                    return m && m[1];
                }

                // URL on its own line (plain or wrapped in <>): embed
                text = text.replace(/^(\s*<?(https?:\/\/(?:www\.)?(?:youtube\.com\/watch\?v=|youtu\.be\/)[^\s<>]+)>?\s*)$/gm, (m, whole, url) => {
                    const cleaned = (url || whole).trim().replace(/^<|>$/g, '');
                    const id = extractId(cleaned);
                    if (!id) return m;
                    return `<div class="video-embed" data-yid="${id}"><iframe loading="lazy" src="https://www.youtube-nocookie.com/embed/${id}?rel=0&origin=${originParam}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen title="YouTube video player"></iframe><div class="video-fallback">Can't play? <a href="https://www.youtube.com/watch?v=${id}" target="_blank" rel="noopener">Open on YouTube</a></div></div>`;
                });

                // markdown link on its own line: [text](youtube-url)
                text = text.replace(/^(\s*\[[^\]]+\]\(\s*(https?:\/\/(?:www\.)?(?:youtube\.com\/watch\?v=|youtu\.be\/)[^\s)]+)\s*\)\s*)$/gm, (m, url) => {
                    const id = extractId(url);
                    if (!id) return m;
                    return `<div class="video-embed" data-yid="${id}"><iframe loading="lazy" src="https://www.youtube-nocookie.com/embed/${id}?rel=0&origin=${originParam}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen title="YouTube video player"></iframe><div class="video-fallback">Can't play? <a href="https://www.youtube.com/watch?v=${id}" target="_blank" rel="noopener">Open on YouTube</a></div></div>`;
                });

                // markdown link where the URL is in the link text and the parentheses are empty: [https://...]()
                text = text.replace(/^\s*\[(https?:\/\/(?:www\.)?(?:youtube\.com\/watch\?v=|youtu\.be\/)[^\]]+)\]\(\s*\)\s*$/gm, (m, url) => {
                    const id = extractId(url);
                    if (!id) return m;
                    return `<div class="video-embed" data-yid="${id}"><iframe loading="lazy" src="https://www.youtube-nocookie.com/embed/${id}?rel=0&origin=${originParam}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen title="YouTube video player"></iframe><div class="video-fallback">Can't play? <a href="https://www.youtube.com/watch?v=${id}" target="_blank" rel="noopener">Open on YouTube</a></div></div>`;
                });

                // angle-bracketed URL anywhere
                text = text.replace(/<https?:\/\/(?:www\.)?(?:youtube\.com\/watch\?v=|youtu\.be\/)[^>]+>/g, (m) => {
                    const url = m.slice(1, -1);
                    const id = extractId(url);
                    if (!id) return m;
                    return `<div class="video-embed" data-yid="${id}"><iframe loading="lazy" src="https://www.youtube-nocookie.com/embed/${id}?rel=0&origin=${originParam}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen title="YouTube video player"></iframe><div class="video-fallback">Can't play? <a href="https://www.youtube.com/watch?v=${id}" target="_blank" rel="noopener">Open on YouTube</a></div></div>`;
                });

                return text;
            }

            const md = window.markdownit({ html: true,
                highlight: function (str, lang) {
                    if (lang) {
                        try {
                            return '<pre><code class="language-' + lang + '">' +
                                hljs.highlight(str, { language: lang }).value +
                                '</code></pre>';
                        } catch (__) {}
                    }
                    return '<pre><code>' + md.utils.escapeHtml(str) + '</code></pre>';
                }
            });

            const previewArea = document.getElementById('preview');
            let processed = rewriteImagePaths(markdownText);
            processed = rewriteYouTubeEmbeds(processed);
            previewArea.innerHTML = md.render(processed);
            enhancePublishedEmbeds(previewArea);
            safeHighlightCodeBlocks(previewArea);
            generateTOC();
            buildSlides();
            attachYouTubePlayers();
        }

        function slugify(text) {
            return text.toLowerCase().trim()
                .replace(/[^\w\s-]/g, '')
                .replace(/\s+/g, '-')
                .replace(/-+/g, '-');
        }

        function safeHighlightCodeBlocks(root) {
            const scope = root || document;
            scope.querySelectorAll('pre code').forEach((block) => {
                if (block.children && block.children.length > 0) return;
                if (block.classList.contains('hljs')) return;
                hljs.highlightElement(block);
            });
        }

        /* YouTube IFrame API-based fallback handler */
        const __ytPending = [];
        let __ytApiLoading = false;
        function ensureYouTubeApiLoaded() {
            if (window.YT && window.YT.Player) {
                return Promise.resolve();
            }
            if (__ytApiLoading) return new Promise((res) => { const i = setInterval(()=>{ if (window.YT && window.YT.Player) { clearInterval(i); res(); } }, 50); });
            __ytApiLoading = true;
            return new Promise((resolve) => {
                const tag = document.createElement('script');
                tag.src = 'https://www.youtube.com/iframe_api';
                const firstScriptTag = document.getElementsByTagName('script')[0];
                firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
                window.onYouTubeIframeAPIReady = () => { resolve(); };
                // safety: also poll in case onYouTube... not fired
                const poll = setInterval(() => { if (window.YT && window.YT.Player) { clearInterval(poll); resolve(); } }, 100);
            });
        }

        function attachYouTubePlayers() {
            const containers = Array.from(document.querySelectorAll('.video-embed')).filter(el => el.dataset.yid && !el.dataset.ytInit);
            if (containers.length === 0) return;
            containers.forEach(el => el.dataset.ytInit = '1');
            ensureYouTubeApiLoaded().then(() => {
                containers.forEach((el, idx) => {
                    tryInitPlayer(el);
                });
            }).catch(() => {
                // leave fallback link visible if API load fails
                containers.forEach(el => showFallback(el));
            });
        }

        function tryInitPlayer(container) {
            const yid = container.dataset.yid;
            if (!yid) return showFallback(container);
            // remove any pre-existing iframe placed by renderer to let API create a managed player
            const existingIframe = container.querySelector('iframe');
            if (existingIframe) existingIframe.remove();
            // create a div placeholder
            const pid = `yt-player-${yid}-${Math.random().toString(36).slice(2,9)}`;
            const placeholder = document.createElement('div');
            placeholder.id = pid;
            placeholder.style.width = '100%';
            placeholder.style.height = '100%';
            // add placeholder at beginning
            container.insertBefore(placeholder, container.firstChild);

            // create the player using the nocookie host to keep privacy mode
            try {
                /* eslint-disable no-undef */
                const player = new YT.Player(pid, {
                    videoId: yid,
                    host: 'https://www.youtube-nocookie.com',
                    playerVars: {
                        rel: 0,
                        modestbranding: 1,
                        origin: window.location.origin || window.location.href
                    },
                    events: {
                        onError: (e) => {
                            // error codes 100, 101, 150 usually mean unavailable or embedding disabled
                            showFallback(container, yid);
                        }
                    }
                });
                /* eslint-enable no-undef */
                // leave the fallback link hidden until error occurs
                const fb = container.querySelector('.video-fallback');
                if (fb) fb.style.display = 'none';
            } catch (e) {
                showFallback(container, yid);
            }
        }

        function showFallback(container, yid) {
            container.classList.add('embed-failed');
            const id = yid || container.dataset.yid;
            container.innerHTML = `<div class="video-fallback">Can't play? <a href="https://www.youtube.com/watch?v=${id}" target="_blank" rel="noopener">Open on YouTube</a></div>`;
        }

        function extractHeadingsFromMarkdown(mdText) {
            const lines = mdText.split(/\r?\n/);
            const headings = [];
            lines.forEach(line => {
                const m = line.match(/^(#{1,6})\s+(.*)$/);
                if (m) {
                    headings.push({ level: m[1].length, text: m[2].trim() });
                }
            });
            return headings;
        }

        function buildNestedListFromHeadings(headings, file) {
            const rootUl = document.createElement('ul');
            const stack = [{ level: 0, ul: rootUl }];
            headings.forEach(h => {
                const level = Math.max(1, Math.min(6, h.level));
                if (level > stack[stack.length - 1].level) {
                    for (let l = stack[stack.length - 1].level + 1; l <= level; l++) {
                        const parentUl = stack[stack.length - 1].ul;
                        let parentLi = parentUl.lastElementChild;
                        if (!parentLi) {
                            parentLi = document.createElement('li');
                            parentUl.appendChild(parentLi);
                        }
                        const newUl = document.createElement('ul');
                        parentLi.appendChild(newUl);
                        stack.push({ level: l, ul: newUl });
                    }
                } else {
                    while (level < stack[stack.length - 1].level) stack.pop();
                }

                const currentUl = stack[stack.length - 1].ul;
                const li = document.createElement('li');
                li.classList.add('toc-item', `toc-l${Math.min(level, 6)}`);
                const a = document.createElement('a');
                a.href = '#';
                a.textContent = h.text;
                a.addEventListener('click', (e) => {
                    e.preventDefault();
                    // load the file and scroll to the heading text
                    loadMarkdownFile(file.fileName, h.text);
                    // expand the file node in the sidebar
                    const fileNode = a.closest('.guide-file');
                    if (fileNode) {
                        const contents = fileNode.querySelector('.guide-file-contents');
                        const caret = fileNode.querySelector('.caret');
                        if (contents && caret) {
                            contents.classList.add('open');
                            caret.textContent = '▾';
                        }
                    }
                });
                li.appendChild(a);
                currentUl.appendChild(li);
            });
            return rootUl;
        }

        // Completed state helpers (localStorage)
        function getCompletedIds() {
            try {
                const raw = localStorage.getItem('tocCompleted') || '[]';
                return new Set(JSON.parse(raw));
            } catch (e) {
                return new Set();
            }
        }

        function saveCompletedIds(set) {
            try {
                localStorage.setItem('tocCompleted', JSON.stringify(Array.from(set)));
            } catch (e) {}
        }

        let tocProgressRaf = null;
        function setupTocScrollProgress(headers) {
            const tocListElement = document.getElementById('toc-list');
            const contentEl = document.getElementById('content');
            if (!tocListElement || !headers || headers.length === 0 || !contentEl) return;

            const links = Array.from(tocListElement.querySelectorAll('a[href^="#"]'));
            if (!links.length) return;

            const updateProgress = () => {
                tocProgressRaf = null;
                let activeIndex = 0;
                const threshold = 120;

                for (let i = 0; i < headers.length; i++) {
                    const rect = headers[i].getBoundingClientRect();
                    if (rect.top <= threshold) {
                        activeIndex = i;
                    } else {
                        break;
                    }
                }

                links.forEach((link, idx) => {
                    const li = link.closest('li');
                    if (!li) return;
                    li.classList.toggle('active', idx === activeIndex);
                    li.classList.toggle('completed', idx < activeIndex);
                });
            };

            const requestUpdate = () => {
                if (tocProgressRaf !== null) return;
                tocProgressRaf = window.requestAnimationFrame(updateProgress);
            };

            contentEl.removeEventListener('scroll', requestUpdate);
            window.removeEventListener('scroll', requestUpdate);
            contentEl.addEventListener('scroll', requestUpdate, { passive: true });
            window.addEventListener('scroll', requestUpdate, { passive: true });
            requestUpdate();
        }

        function generateTOC() {
            const tocListElement = document.getElementById('toc-list');
            tocListElement.innerHTML = '';
            const headers = Array.from(document.getElementById('preview').querySelectorAll('h1, h2, h3, h4, h5, h6'));
            if (headers.length === 0) return;

            const completed = getCompletedIds();

            const rootUl = document.createElement('ul');
            rootUl.className = 'toc-root';
            const stack = [{ level: 0, ul: rootUl }];

            headers.forEach(header => {
                // ensure header has id
                if (!header.id) {
                    let id = slugify(header.textContent);
                    let uniqueId = id;
                    let idx = 1;
                    while (document.getElementById(uniqueId)) {
                        uniqueId = `${id}-${idx++}`;
                    }
                    header.id = uniqueId;
                }

                const level = parseInt(header.tagName.substring(1), 10);

                // Adjust stack to the correct level
                if (level > stack[stack.length - 1].level) {
                    for (let l = stack[stack.length - 1].level + 1; l <= level; l++) {
                        const parentUl = stack[stack.length - 1].ul;
                        let parentLi = parentUl.lastElementChild;
                        if (!parentLi) {
                            parentLi = document.createElement('li');
                            parentUl.appendChild(parentLi);
                        }
                        const newUl = document.createElement('ul');
                        parentLi.appendChild(newUl);
                        stack.push({ level: l, ul: newUl });
                    }
                } else {
                    while (level < stack[stack.length - 1].level) {
                        stack.pop();
                    }
                }

                const currentUl = stack[stack.length - 1].ul;
                const li = document.createElement('li');

                // toggle button for completed state
                const toggleBtn = document.createElement('button');
                toggleBtn.className = 'toc-complete-toggle';
                toggleBtn.title = 'Mark completed';
                toggleBtn.addEventListener('click', (ev) => {
                    ev.preventDefault();
                    ev.stopPropagation();
                    const id = header.id;
                    if (completed.has(id)) {
                        completed.delete(id);
                        toggleBtn.classList.remove('checked');
                        li.classList.remove('completed');
                    } else {
                        completed.add(id);
                        toggleBtn.classList.add('checked');
                        li.classList.add('completed');
                    }
                    saveCompletedIds(completed);
                });

                const link = document.createElement('a');
                link.className = 'toc-link';
                link.href = `#${header.id}`;
                link.textContent = header.textContent;
                link.title = header.textContent;
                link.addEventListener('click', (e) => {
                    e.preventDefault();
                    header.scrollIntoView({ behavior: 'smooth' });
                    // mark the clicked item as active
                    tocListElement.querySelectorAll('li').forEach(item => item.classList.remove('active'));
                    li.classList.add('active');
                });
                link.addEventListener('dblclick', (e) => {
                    e.preventDefault();
                    enterInlineSlidesAtHeaderId(header.id);
                });

                // set initial completed state
                if (completed.has(header.id)) {
                    toggleBtn.classList.add('checked');
                    li.classList.add('completed');
                }

                li.appendChild(toggleBtn);
                li.appendChild(link);
                currentUl.appendChild(li);
            });

            // mark items with children for L-branch visuals
            rootUl.querySelectorAll('li').forEach(item => {
                if (item.querySelector('ul')) item.classList.add('has-children');
            });

            tocListElement.appendChild(rootUl);
            setupTocScrollProgress(headers);
        }

        // --- Slide mode functionality ---
        let slides = [];
        let currentSlide = 0;

        function buildSlides() {
            slides = [];
            const preview = document.getElementById('preview');
            if (!preview) return;

            const headers = Array.from(preview.querySelectorAll('h1, h2, h3, h4, h5, h6'));

            // No headers -> one slide with all content.
            if (headers.length === 0) {
                slides = [{ id: null, html: preview.innerHTML }];
                updateSlideCounters();
                return;
            }

            headers.forEach((header) => {
                let html = header.outerHTML;
                let el = header.nextElementSibling;
                let hasContent = false;

                while (el && !(el.tagName && /^H[1-6]$/.test(el.tagName))) {
                    const text = (el.textContent || '').trim();
                    if (text || el.querySelector('*')) hasContent = true;
                    html += el.outerHTML;
                    el = el.nextElementSibling;
                }

                // Skip heading-only sections for cleaner slides.
                if (!hasContent) return;

                slides.push({
                    id: header.id || null,
                    html
                });
            });

            // Fallback when all sections are heading-only.
            if (slides.length === 0 && headers[0]) {
                slides = [{ id: headers[0].id || null, html: headers[0].outerHTML }];
            }
            updateSlideCounters();
        }

        function updateSlideCounters() {
            const total = slides.length;
            const index = total ? currentSlide + 1 : 0;
            const label = `${index} / ${total}`;
            const counter = document.getElementById('slide-counter');
            const counterInline = document.getElementById('slide-counter-inline');
            if (counter) counter.textContent = label;
            if (counterInline) counterInline.textContent = label;
        }

        function openSlides(startIndex = 0) {
            const overlay = document.getElementById('slides-overlay');
            if (!overlay) return;
            if (!slides.length) buildSlides();
            if (!slides.length) return;
            currentSlide = Math.max(0, Math.min(startIndex, slides.length - 1));
            overlay.classList.add('open');
            overlay.setAttribute('aria-hidden', 'false');
            updateSlide();
        }

        function closeSlides() {
            const overlay = document.getElementById('slides-overlay');
            if (!overlay) return;
            overlay.classList.remove('open');
            overlay.setAttribute('aria-hidden', 'true');
        }

        function updateSlide() {
            const content = document.getElementById('slide-content');
            if (!content) return;
            content.innerHTML = slides[currentSlide] ? slides[currentSlide].html : '';
            const prevBtn = document.getElementById('slide-prev');
            const nextBtn = document.getElementById('slide-next');
            if (prevBtn) prevBtn.disabled = currentSlide === 0;
            if (nextBtn) nextBtn.disabled = currentSlide === slides.length - 1;
            updateSlideCounters();
            // ensure syntax highlighting inside slide
            safeHighlightCodeBlocks(content);
        }

        function nextSlide() {
            if (currentSlide < slides.length - 1) {
                currentSlide++;
                updateSlide();
            }
        }

        function prevSlide() {
            if (currentSlide > 0) {
                currentSlide--;
                updateSlide();
            }
        }

        function openSlidesAtHeaderId(id) {
            const idx = slides.findIndex(s => s.id === id);
            if (idx >= 0) openSlides(idx);
        }

        // UI hooks
        document.addEventListener('click', (e) => {
            if (e.target && e.target.id === 'slides-toggle') {
                e.preventDefault();
                // toggle inline slide view
                const isInline = document.body.classList.contains('slide-inline-active');
                if (isInline) exitInlineSlides();
                else enterInlineSlides(0);
            }
        });

        const nextBtnInit = document.getElementById('slide-next');
        if (nextBtnInit) nextBtnInit.addEventListener('click', nextSlide);
        const prevBtnInit = document.getElementById('slide-prev');
        if (prevBtnInit) prevBtnInit.addEventListener('click', prevSlide);
        const closeBtnInit = document.getElementById('slides-close');
        if (closeBtnInit) closeBtnInit.addEventListener('click', closeSlides);

        // keyboard navigation for overlay and inline slide view
        document.addEventListener('keydown', (e) => {
            const overlay = document.getElementById('slides-overlay');
            const inlineActive = document.body.classList.contains('slide-inline-active');
            if ((overlay && overlay.classList.contains('open'))) {
                if (e.key === 'ArrowRight') nextSlide();
                else if (e.key === 'ArrowLeft') prevSlide();
                else if (e.key === 'Escape') closeSlides();
                return;
            }
            if (inlineActive) {
                if (e.key === 'ArrowRight') nextSlideInline();
                else if (e.key === 'ArrowLeft') prevSlideInline();
                else if (e.key === 'Escape') exitInlineSlides();
            }
        });

        // Inline slide controls
        function enterInlineSlides(startIndex = 0) {
            buildSlides();
            if (!slides.length) return;
            currentSlide = Math.max(0, Math.min(startIndex, slides.length - 1));
            // activate slide-only UI
            document.body.classList.add('slide-inline-active');
            // prevent background scroll
            document.documentElement.style.overflow = 'hidden';
            document.body.style.overflow = 'hidden';
            // hide preview container (kept for restoration) and other UI via CSS rules
            document.getElementById('preview').closest('.preview-container').style.display = 'none';
            const sv = document.getElementById('slide-view');
            sv.classList.add('open');
            sv.style.display = 'block';
            document.getElementById('slides-toggle').classList.add('active');
            document.getElementById('slides-toggle').textContent = 'View as document';
            updateSlideInline();
        }

        function exitInlineSlides() {
            document.body.classList.remove('slide-inline-active');
            // restore scrolling
            document.documentElement.style.overflow = '';
            document.body.style.overflow = '';
            const sv = document.getElementById('slide-view');
            sv.classList.remove('open');
            sv.style.display = 'none';
            document.getElementById('preview').closest('.preview-container').style.display = '';
            document.getElementById('slides-toggle').classList.remove('active');
            document.getElementById('slides-toggle').textContent = 'View as slides';
        }

        function updateSlideInline() {
            const content = document.getElementById('slide-inline');
            if (!content) return;
            content.innerHTML = slides[currentSlide] ? slides[currentSlide].html : '';
            const prevBtn = document.getElementById('slide-prev-inline');
            const nextBtn = document.getElementById('slide-next-inline');
            if (prevBtn) prevBtn.disabled = currentSlide === 0;
            if (nextBtn) nextBtn.disabled = currentSlide === slides.length - 1;
            updateSlideCounters();
            // ensure syntax highlighting inside slide
            safeHighlightCodeBlocks(content);
        }

        function nextSlideInline() { if (currentSlide < slides.length - 1) { currentSlide++; updateSlideInline(); } }
        function prevSlideInline() { if (currentSlide > 0) { currentSlide--; updateSlideInline(); } }

        const nextInlineBtn = document.getElementById('slide-next-inline');
        if (nextInlineBtn) nextInlineBtn.addEventListener('click', nextSlideInline);
        const prevInlineBtn = document.getElementById('slide-prev-inline');
        if (prevInlineBtn) prevInlineBtn.addEventListener('click', prevSlideInline);
        const closeInlineBtn = document.getElementById('slide-close-inline');
        if (closeInlineBtn) closeInlineBtn.addEventListener('click', exitInlineSlides);

        // helper to open inline slide for a specific header id
        function enterInlineSlidesAtHeaderId(id) {
            const idx = slides.findIndex(s => s.id === id);
            if (idx >= 0) enterInlineSlides(idx);
        }

        let studioInitialized = false;
        let studioSelectedPath = '';

        function studioSetStatus(message, isError = false) {
            const el = document.getElementById('studio-status');
            if (!el) return;
            el.textContent = message;
            el.style.color = isError ? '#fca5a5' : '#93c5fd';
        }

        function studioRewriteImagePaths(mdText) {
            let text = mdText || '';
            const mediaRoot = (appConfig && appConfig.mediaPath) ? appConfig.mediaPath.replace(/\/+$/, '') : null;
            text = text.replace(/!\[\[([^\]]+)\]\]/g, (m, inner) => {
                let path = inner.split('|')[0].trim().replace(/^\/+/, '');
                const src = mediaRoot ? `${mediaRoot}/${encodeURI(path)}` : encodeURI(path);
                return `![](${src})`;
            });
            text = text.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, (m, alt, src) => {
                src = (src || '').trim();
                if (src.startsWith('<') && src.endsWith('>')) src = src.slice(1, -1);
                if (/^(?:https?:|data:|\/|\.\.|\.\/)/i.test(src) || src.includes(':')) return `![${alt}](${src})`;
                if (!mediaRoot) return m;
                return `![${alt}](${encodeURI(`${mediaRoot}/${src}`)})`;
            });
            return text;
        }

        function renderStudioMarkdownPreview(markdownText) {
            const out = document.getElementById('studio-markdown-preview');
            if (!out) return;
            const md = window.markdownit({
                html: true,
                highlight: function (str, lang) {
                    if (lang) {
                        try {
                            return '<pre><code class="language-' + lang + '">' +
                                hljs.highlight(str, { language: lang }).value +
                                '</code></pre>';
                        } catch (__) {}
                    }
                    return '<pre><code>' + md.utils.escapeHtml(str) + '</code></pre>';
                }
            });
            const processed = studioRewriteImagePaths(markdownText || '');
            out.innerHTML = md.render(processed);
            safeHighlightCodeBlocks(out);
            out.contentEditable = studioVisualEditEnabled ? 'true' : 'false';
            out.classList.toggle('visual-edit', !!studioVisualEditEnabled);
            enhanceStudioEmbeds(out);
        }

        function studioHtmlToMarkdown(html) {
            if (!window.TurndownService) return null;
            const turndown = new window.TurndownService({
                headingStyle: 'atx',
                codeBlockStyle: 'fenced',
                emDelimiter: '*'
            });
            turndown.addRule('keepImageAlt', {
                filter: 'img',
                replacement: function (content, node) {
                    const src = node.getAttribute('src') || '';
                    const alt = node.getAttribute('alt') || '';
                    return src ? `![${alt}](${src})` : '';
                }
            });
            turndown.addRule('keepIframeHtml', {
                filter: 'iframe',
                replacement: function (content, node) {
                    const src = node.getAttribute('src') || '';
                    if (!src) return '';
                    const width = node.getAttribute('width') || '100%';
                    const height = node.getAttribute('height') || '420';
                    const style = node.getAttribute('style') || 'border:0;max-width:100%;';
                    const loading = node.getAttribute('loading') || 'lazy';
                    const allow = node.getAttribute('allow') || '';
                    const allowFullscreen = node.hasAttribute('allowfullscreen') ? ' allowfullscreen' : '';
                    return `\n<iframe src="${src}" width="${width}" height="${height}" style="${style}" loading="${loading}"${allow ? ` allow="${allow}"` : ''}${allowFullscreen}></iframe>\n\n`;
                }
            });
            return turndown.turndown(html || '');
        }

        function getIframeInitialSize(iframe) {
            const widthRaw = (iframe.getAttribute('width') || '').toString().trim();
            const heightRaw = (iframe.getAttribute('height') || '').toString().trim();
            let width = widthRaw || '100%';
            let height = parseInt(heightRaw, 10);
            if (!Number.isFinite(height) || height < 120) height = 420;
            if (/^\d+$/.test(width)) width = `${width}px`;
            if (!/^\d+(%|px)$/.test(width)) width = '100%';
            return { width, height };
        }

        function makeIframeResizable(box, iframe) {
            if (!box || !iframe || box.dataset.resizeBound === '1') return;
            box.dataset.resizeBound = '1';
            const handle = document.createElement('div');
            handle.className = 'studio-embed-handle';
            box.appendChild(handle);

            let startX = 0;
            let startY = 0;
            let startW = 0;
            let startH = 0;
            let dragging = false;

            const onMove = (ev) => {
                if (!dragging) return;
                const dx = ev.clientX - startX;
                const dy = ev.clientY - startY;
                const nextW = Math.max(240, startW + dx);
                const nextH = Math.max(135, startH + dy);
                box.style.width = `${Math.round(nextW)}px`;
                box.style.height = `${Math.round(nextH)}px`;
            };

            const onUp = () => {
                if (!dragging) return;
                dragging = false;
                window.removeEventListener('pointermove', onMove);
                window.removeEventListener('pointerup', onUp);
                clearTimeout(studioPreviewSyncTimer);
                studioPreviewSyncTimer = setTimeout(() => {
                    syncMarkdownFromVisualPreview();
                }, 120);
            };

            handle.addEventListener('pointerdown', (ev) => {
                ev.preventDefault();
                ev.stopPropagation();
                dragging = true;
                startX = ev.clientX;
                startY = ev.clientY;
                const rect = box.getBoundingClientRect();
                startW = rect.width;
                startH = rect.height;
                window.addEventListener('pointermove', onMove);
                window.addEventListener('pointerup', onUp);
            });

            // Native CSS resize corner changes size without pointer handlers; observe and sync.
            if (window.ResizeObserver) {
                const ro = new ResizeObserver(() => {
                    if (!studioVisualEditEnabled) return;
                    clearTimeout(studioPreviewSyncTimer);
                    studioPreviewSyncTimer = setTimeout(() => {
                        syncMarkdownFromVisualPreview();
                    }, 160);
                });
                ro.observe(box);
            }
        }

        function enhanceStudioEmbeds(container) {
            if (!container) return;
            const iframes = Array.from(container.querySelectorAll('iframe'));
            iframes.forEach((iframe) => {
                if (iframe.closest('.video-embed')) return;
                if (iframe.closest('.studio-embed-box')) return;
                const size = getIframeInitialSize(iframe);
                const box = document.createElement('div');
                box.className = 'studio-embed-box';
                box.style.width = size.width;
                box.style.height = `${size.height}px`;
                iframe.removeAttribute('width');
                iframe.removeAttribute('height');
                iframe.style.width = '100%';
                iframe.style.height = '100%';
                iframe.style.maxWidth = '100%';
                const parent = iframe.parentNode;
                parent.insertBefore(box, iframe);
                box.appendChild(iframe);
                makeIframeResizable(box, iframe);
            });

            // ensure existing wrapped embeds get handles/listeners once
            container.querySelectorAll('.studio-embed-box').forEach((box) => {
                const iframe = box.querySelector('iframe');
                makeIframeResizable(box, iframe);
            });
        }

        function enhancePublishedEmbeds(container) {
            if (!container) return;
            const iframes = Array.from(container.querySelectorAll('iframe'));
            iframes.forEach((iframe) => {
                if (iframe.closest('.video-embed')) return;
                if (iframe.closest('.live-embed-box')) return;
                const size = getIframeInitialSize(iframe);
                const box = document.createElement('div');
                box.className = 'live-embed-box';
                box.style.width = size.width;
                box.style.height = `${size.height}px`;
                iframe.removeAttribute('width');
                iframe.removeAttribute('height');
                iframe.style.width = '100%';
                iframe.style.height = '100%';
                const parent = iframe.parentNode;
                parent.insertBefore(box, iframe);
                box.appendChild(iframe);
            });
        }

        function extractYouTubeVideoId(url) {
            const value = (url || '').trim();
            if (!value) return null;
            try {
                const u = new URL(value);
                if (u.hostname.includes('youtu.be')) {
                    return u.pathname.replace(/^\/+/, '').split(/[?#]/)[0] || null;
                }
                if (u.hostname.includes('youtube.com')) {
                    if (u.pathname.startsWith('/shorts/')) {
                        return u.pathname.split('/')[2] || null;
                    }
                    const v = u.searchParams.get('v');
                    return v || null;
                }
            } catch (e) {
                const m = value.match(/(?:v=|youtu\.be\/|youtube\.com\/shorts\/)([A-Za-z0-9_-]{11})/);
                return m ? m[1] : null;
            }
            return null;
        }

        function getStudioVideoEmbedSize() {
            let width = '100%';
            let height = 420;

            if (/^\d+$/.test(width)) width = `${width}px`;
            if (!/^\d+(%|px)$/.test(width)) width = '100%';

        function syncMarkdownFromVisualPreview() {
            if (!studioVisualEditEnabled) return;
            const preview = document.getElementById('studio-markdown-preview');
            const editor = document.getElementById('studio-markdown-editor');
            if (!preview || !editor) return;

            // Capture actual rendered box size before cloning HTML.
            preview.querySelectorAll('.studio-embed-box').forEach((box) => {
                const styleWidth = (box.style.width || '').toString().trim();
                const rect = box.getBoundingClientRect();
                box.setAttribute('data-sync-width', String(Math.max(240, Math.round(rect.width || box.clientWidth || 640))));
                box.setAttribute('data-sync-height', String(Math.max(135, Math.round(rect.height || box.clientHeight || 420))));
                box.setAttribute('data-sync-width-style', styleWidth);
            });

            const temp = document.createElement('div');
            temp.innerHTML = preview.innerHTML;
            // Convert resizable wrapper back to plain iframe with explicit dimensions.
            temp.querySelectorAll('.studio-embed-box').forEach((box) => {
                const iframe = box.querySelector('iframe');
                if (!iframe) return;
                const widthStyle = (box.style.width || '').toString().trim();
                const wFromStyle = parseInt(widthStyle.replace('px', ''), 10);
                const hFromStyle = parseInt((box.style.height || '').toString().replace('px', ''), 10);
                const wFromData = parseInt((box.getAttribute('data-sync-width') || ''), 10);
                const hFromData = parseInt((box.getAttribute('data-sync-height') || ''), 10);
                const widthStyleFromData = (box.getAttribute('data-sync-width-style') || '').trim();
                const w = Math.max(240, Number.isFinite(wFromData) ? wFromData : (Number.isFinite(wFromStyle) ? wFromStyle : 640));
                const h = Math.max(135, Number.isFinite(hFromData) ? hFromData : (Number.isFinite(hFromStyle) ? hFromStyle : 420));
                if (/%$/.test(widthStyleFromData || widthStyle)) iframe.setAttribute('width', (widthStyleFromData || widthStyle));
                else iframe.setAttribute('width', String(w));
                iframe.setAttribute('height', String(h));
                iframe.style.width = '';
                iframe.style.height = '';
                iframe.style.maxWidth = '';
                box.replaceWith(iframe);
            });
            const markdown = studioHtmlToMarkdown(temp.innerHTML);
            if (markdown == null) {
                studioSetStatus('Visual edit requires Turndown; markdown sync unavailable.', true);
                return;
            }
            editor.value = markdown;
        }

        function studioInsertAtCursor(snippet) {
            const editor = document.getElementById('studio-markdown-editor');
            if (!editor) return;

            const start = editor.selectionStart || 0;
            const end = editor.selectionEnd || 0;
            const value = editor.value || '';
            const before = value.slice(0, start);
            const after = value.slice(end);
            const prefix = before && !before.endsWith('\n') ? '\n' : '';
            const insertText = `${prefix}${snippet}`;
            editor.value = before + insertText + after;

            const caret = before.length + insertText.length;
            editor.selectionStart = caret;
            editor.selectionEnd = caret;
            editor.focus();
            renderStudioMarkdownPreview(editor.value);
        }

        function getAllLessonEntries() {
            const items = [];
            sortGroups(appConfig.markdownFiles || []).forEach((group, groupIndex) => {
                const gp = group.path ? (group.path.endsWith('/') ? group.path.slice(0, -1) : group.path) : '';
                sortLessonFiles(group.files || []).forEach((file, fileIndex) => {
                    items.push({
                        groupIndex,
                        fileIndex,
                        group,
                        file,
                        resolved: gp ? `${gp}/${file.fileName}` : file.fileName
                    });
                });
            });
            return items;
        }

        function getLessonByResolvedPath(path) {
            return getAllLessonEntries().find((x) => x.resolved === path) || null;
        }

        function normalizeGroupPath(path) {
            const p = (path || '').trim();
            if (!p) return '';
            return p.endsWith('/') ? p : `${p}/`;
        }

        function removeLessonByPath(path) {
            for (let gi = 0; gi < (appConfig.markdownFiles || []).length; gi++) {
                const group = appConfig.markdownFiles[gi];
                const gp = group.path ? (group.path.endsWith('/') ? group.path.slice(0, -1) : group.path) : '';
                for (let fi = 0; fi < (group.files || []).length; fi++) {
                    const file = group.files[fi];
                    const resolved = gp ? `${gp}/${file.fileName}` : file.fileName;
                    if (resolved === path) {
                        group.files.splice(fi, 1);
                        if (!group.files.length) appConfig.markdownFiles.splice(gi, 1);
                        return true;
                    }
                }
            }
            return false;
        }

        function getOrCreateGroup(groupName, groupPath) {
            const normalizedPath = normalizeGroupPath(groupPath);
            let found = (appConfig.markdownFiles || []).find(
                (g) => (g.group || '').trim() === (groupName || '').trim() && normalizeGroupPath(g.path || '') === normalizedPath
            );
            if (found) return found;

            found = {
                group: (groupName || 'New Group').trim(),
                path: normalizedPath,
                files: []
            };
            appConfig.markdownFiles.push(found);
            return found;
        }

        function populateGroupNameSelect(selectedName = '') {
            const select = document.getElementById('studio-group-name');
            const newInput = document.getElementById('studio-group-name-new');
            if (!select) return;

            const names = getUniqueGroupNames();
            select.innerHTML = '';
            names.forEach((name) => {
                const opt = document.createElement('option');
                opt.value = name;
                opt.textContent = name;
                select.appendChild(opt);
            });

            const createOpt = document.createElement('option');
            createOpt.value = '__new__';
            createOpt.textContent = '+ Create New Group';
            select.appendChild(createOpt);

            if (selectedName && names.includes(selectedName)) {
                select.value = selectedName;
                setNewGroupMode(false);
            } else if (selectedName && !names.includes(selectedName)) {
                select.value = '__new__';
                if (newInput) newInput.value = selectedName;
                setNewGroupMode(true);
            } else if (names.length) {
                select.value = names[0];
                setNewGroupMode(false);
            } else {
                select.value = '__new__';
                if (newInput) newInput.value = '';
                setNewGroupMode(true);
            }
        }

        async function studioLoadLessonIntoForm(path) {
            studioSelectedPath = path || '';
            const setVal = (id, v) => {
                const el = document.getElementById(id);
                if (el) el.value = v || '';
            };

            if (!studioSelectedPath) {

            const entry = getLessonByResolvedPath(studioSelectedPath);
            if (!entry) return;

            populateGroupNameSelect(entry.group.group);
            setVal('studio-group-path', entry.group.path || '');
            setVal('studio-group-sequence', Number.isFinite(Number(entry.group.sequence)) ? String(entry.group.sequence) : '');
            setVal('studio-file-name', entry.file.fileName);
            setVal('studio-display-name', entry.file.displayName);
            setVal('studio-sequence', Number.isFinite(Number(entry.file.sequence)) ? String(entry.file.sequence) : '');
            setVal('studio-starter-link', entry.file.starterRepo || entry.file.starter || '');
            setVal('studio-final-link', entry.file.finalRepo || entry.file.final || '');

            let content = '';
            if (Object.prototype.hasOwnProperty.call(studioContentMap, studioSelectedPath)) {
                content = studioContentMap[studioSelectedPath] || '';
            } else {
                try {
                    const r = await fetch(studioSelectedPath);
                    if (r.ok) content = await r.text();
                } catch (e) {}
            }
            setVal('studio-markdown-editor', content);
            renderStudioMarkdownPreview(content);
        }

        async function studioSaveLessonMetadata() {
            const read = (id) => {
                const el = document.getElementById(id);
                return el ? el.value.trim() : '';
            };

            const groupName = getStudioGroupNameValue() || 'New Group';
            const groupPath = normalizeGroupPath(read('studio-group-path'));
            const groupSequenceRaw = read('studio-group-sequence');
            const fileName = read('studio-file-name');
            const displayName = read('studio-display-name') || fileName;
            const sequenceRaw = read('studio-sequence');
            const starterRepo = read('studio-starter-link');
            const finalRepo = read('studio-final-link');
            const markdown = (document.getElementById('studio-markdown-editor') || {}).value || '';

            if (!fileName) {
                studioSetStatus('Markdown file name is required.', true);
                return null;
            }

            const oldPath = studioSelectedPath;
            if (oldPath) removeLessonByPath(oldPath);

            const group = getOrCreateGroup(groupName, groupPath);
            const groupSequence = Number.parseInt(groupSequenceRaw, 10);
            if (Number.isFinite(groupSequence) && groupSequence >= 0) {
                group.sequence = groupSequence;
            } else {
                delete group.sequence;
            }
            const lesson = { fileName, displayName };
            const sequence = Number.parseInt(sequenceRaw, 10);
            if (Number.isFinite(sequence) && sequence >= 0) {
                lesson.sequence = sequence;
            }
            if (starterRepo) lesson.starterRepo = starterRepo;
            if (finalRepo) lesson.finalRepo = finalRepo;
            group.files.push(lesson);

            const newPath = resolveFilePath(group.path || '', fileName);

            if (oldPath && oldPath !== newPath && Object.prototype.hasOwnProperty.call(studioContentMap, oldPath)) {
                studioContentMap[newPath] = studioContentMap[oldPath];
                delete studioContentMap[oldPath];
            }
            studioContentMap[newPath] = markdown;

            appConfig = sanitizeConfigShape(appConfig);
            persistStudioState();
            applyConfig(appConfig);
            studioPopulateLessonSelect(newPath);
            await studioLoadLessonIntoForm(newPath);
            studioSetStatus(`Saved lesson "${displayName}".`);
            return newPath;
        }

        function toKebabCase(input) {
            return (input || '')
                .toLowerCase()
                .replace(/[^a-z0-9]+/g, '-')
                .replace(/^-+|-+$/g, '')
                .replace(/-+/g, '-');
        }

        function toTitleSlug(input) {
            const words = (input || '')
                .replace(/[^A-Za-z0-9]+/g, ' ')
                .trim()
                .split(/\s+/)
                .filter(Boolean);
            if (!words.length) return 'New-Group';
            return words
                .map((w) => (/^\d+$/.test(w) ? w : (w.charAt(0).toUpperCase() + w.slice(1).toLowerCase())))
                .join('-');
        }

            groupPathEl.value = `./ThreejsExamples/${groupSegment}/docs/`;
            fileNameEl.value = `${fileSegment}.md`;

            const autoGen = document.getElementById('studio-auto-generate-meta');
            const groupNameSelect = document.getElementById('studio-group-name');
            const groupNameNewInput = document.getElementById('studio-group-name-new');
            const displayNameInput = document.getElementById('studio-display-name');

            openBtn.addEventListener('click', async () => {
                const allowed = await ensureStudioAuthenticated();
                if (!allowed) return;
                window.location.hash = 'studio';
            });

            closeBtn.addEventListener('click', () => {
                const current = getSavedLastFile();
                const base = window.location.origin + window.location.pathname + window.location.search;
                if (current) {
                    history.replaceState({}, '', `${base}#file=${encodeURIComponent(current)}`);
                } else {
                    history.replaceState({}, '', base);
                }
                closeStudioPage();
            });

            select.addEventListener('change', async (e) => {
                await studioLoadLessonIntoForm(e.target.value);
            });

            if (editor) {
                editor.addEventListener('input', (e) => {
                    if (!studioVisualEditEnabled) {
                        renderStudioMarkdownPreview(e.target.value || '');
                    }
                });

                editor.addEventListener('paste', (e) => {
                    const text = (e.clipboardData && e.clipboardData.getData('text/plain')) || '';
                    const videoId = extractYouTubeVideoId(text);
                    if (!videoId) return;
                    e.preventDefault();
                    const iframe = createYouTubeEmbedHtml(videoId);
                    studioInsertAtCursor(`${iframe}\n`);
                    studioSetStatus('YouTube URL pasted: embedded automatically.');
                });
            }

            if (preview) {
                preview.addEventListener('input', () => {
                    if (!studioVisualEditEnabled) return;
                    clearTimeout(studioPreviewSyncTimer);
                    studioPreviewSyncTimer = setTimeout(() => {
                        syncMarkdownFromVisualPreview();
                    }, 200);
                });
                preview.addEventListener('click', (e) => {
                    if (!studioVisualEditEnabled) return;
                    if (e.target && e.target.closest('a')) {
                        e.preventDefault();
                    }
                });

                preview.addEventListener('paste', (e) => {
                    if (!studioVisualEditEnabled) return;
                    const text = (e.clipboardData && e.clipboardData.getData('text/plain')) || '';
                    const videoId = extractYouTubeVideoId(text);
                    if (!videoId) return;
                    e.preventDefault();
                    const iframe = createYouTubeEmbedHtml(videoId);
                    document.execCommand('insertHTML', false, iframe);
                    clearTimeout(studioPreviewSyncTimer);
                    studioPreviewSyncTimer = setTimeout(() => {
                        syncMarkdownFromVisualPreview();
                        studioSetStatus('YouTube URL pasted: embedded automatically.');
                    }, 120);
                });
            }

            if (visualEditBtn) {
                visualEditBtn.addEventListener('change', (e) => {
                    setStudioVisualEditMode(!!e.target.checked);
                });
            }

            if (projectSettingsToggle) {
                projectSettingsToggle.addEventListener('click', () => {
                    const section = document.getElementById('project-settings-section');
                    const collapsed = !(section && section.classList.contains('collapsed'));
                    setProjectSettingsCollapsed(collapsed);
                });
            }

            if (groupNameSelect) {
                groupNameSelect.addEventListener('change', () => {
                    const creatingNew = groupNameSelect.value === '__new__';
                    setNewGroupMode(creatingNew);
                    if (!creatingNew) {
                        const gp = getFirstPathForGroupName(groupNameSelect.value);
                        const gpEl = document.getElementById('studio-group-path');
                        if (gpEl && gp) gpEl.value = gp;
                    }
                    if (autoGen && autoGen.checked) generatePathAndFileNameFromFields();
                });
            }

            if (groupNameNewInput) {
                groupNameNewInput.addEventListener('input', () => {
                    if (autoGen && autoGen.checked) generatePathAndFileNameFromFields();
                });
            }

            if (genBtn) {
                genBtn.addEventListener('click', () => {
                    generatePathAndFileNameFromFields();
                    studioSetStatus('Generated path and markdown file name.');
                });
            }

            const maybeAutoGenerate = () => {
                if (!autoGen || !autoGen.checked) return;
                generatePathAndFileNameFromFields();
            };
            if (displayNameInput) displayNameInput.addEventListener('input', maybeAutoGenerate);

            const bindInsert = (id, fn) => {
                const el = document.getElementById(id);
                if (!el) return;
                el.addEventListener('click', fn);
            };

            bindInsert('studio-add-heading', () => {
                studioInsertAtCursor('\n## New Heading\n\n');
            });

            bindInsert('studio-add-text', () => {
                studioInsertAtCursor('New paragraph text.\n');
            });

            bindInsert('studio-add-code', () => {
                studioInsertAtCursor('\n```js\n// your code\n```\n\n');
            });

            bindInsert('studio-add-image', () => {
                const src = window.prompt('Image URL or path', './ThreejsExamples/Media/image.png');
                if (!src) return;
                const alt = window.prompt('Alt text', 'Image') || 'Image';
                studioInsertAtCursor(`\n![${alt}](${src})\n\n`);
            });

            bindInsert('studio-add-url-link', () => {
                const url = window.prompt('URL', 'https://example.com');
                if (!url) return;
                const label = window.prompt('Link label', 'Open Link') || 'Open Link';
                studioInsertAtCursor(`\n[${label}](${url})\n\n`);
            });

            bindInsert('studio-add-embed-link', () => {
                const url = window.prompt('URL to link/embed', 'https://example.com');
                if (!url) return;
                const size = getStudioVideoEmbedSize();
                studioInsertAtCursor(`\n<iframe src="${url}" width="${size.width}" height="${size.height}" style="border:0;max-width:100%;" loading="lazy" allowfullscreen></iframe>\n\n`);
            });

            bindInsert('studio-add-olist', () => {
                studioInsertAtCursor('\n1. First item\n2. Second item\n3. Third item\n\n');
            });

            bindInsert('studio-add-ulist', () => {
                studioInsertAtCursor('\n- First item\n- Second item\n- Third item\n\n');
            });

            document.getElementById('studio-new-lesson').addEventListener('click', () => {
                studioSelectedPath = '';
                select.value = '';
                studioLoadLessonIntoForm('');
                studioSetStatus('Fill fields and click "Save Lesson Metadata" to create a lesson.');
            });

            document.getElementById('studio-delete-lesson').addEventListener('click', async () => {
                if (!studioSelectedPath) {
                    studioSetStatus('Select a lesson to delete.', true);
                    return;
                }
                const target = studioSelectedPath;
                removeLessonByPath(target);
                delete studioContentMap[target];
                persistStudioState();
                applyConfig(appConfig);
                const first = getAllResolvedFiles()[0] || '';
                studioPopulateLessonSelect(first);
                await studioLoadLessonIntoForm(first);
                if (first) loadMarkdownFile(first);
                studioSetStatus(`Deleted lesson ${target}.`);
            });

            document.getElementById('studio-save-config').addEventListener('click', () => {
                studioReadGeneralConfigFromForm();
                appConfig = sanitizeConfigShape(appConfig);
                persistStudioState();
                applyConfig(appConfig);
                studioSetStatus('Config saved to Studio.');
            });

            document.getElementById('studio-download-config').addEventListener('click', () => {
                studioReadGeneralConfigFromForm();
                downloadTextFile('config.json', JSON.stringify(sanitizeConfigShape(appConfig), null, 2), 'application/json');
                studioSetStatus('Downloaded config.json.');
            });

            document.getElementById('studio-save-lesson').addEventListener('click', async () => {
                if (studioVisualEditEnabled) syncMarkdownFromVisualPreview();
                await studioSaveLessonMetadata();
            });

            document.getElementById('studio-save-draft').addEventListener('click', async () => {
                if (studioVisualEditEnabled) syncMarkdownFromVisualPreview();
                let path = studioSelectedPath;
                if (!path) path = await studioSaveLessonMetadata();
                if (!path) return;
                const editor = document.getElementById('studio-markdown-editor');
                studioContentMap[path] = editor ? editor.value : '';
                persistStudioState();
                studioSetStatus(`Draft saved for ${path}.`);
            });

            document.getElementById('studio-publish').addEventListener('click', async () => {
                if (studioVisualEditEnabled) syncMarkdownFromVisualPreview();
                let path = studioSelectedPath;
                if (!path) path = await studioSaveLessonMetadata();
                if (!path) return;
                const editor = document.getElementById('studio-markdown-editor');
                studioContentMap[path] = editor ? editor.value : '';
                persistStudioState();
                const publishResult = await publishStudioToGitHub(path, studioContentMap[path]);
                await loadMarkdownFile(path);
                if (publishResult.ok) {
                    studioSetStatus(`Published ${path} to GitHub.`);
                } else if (publishResult.skipped) {
                    studioSetStatus(`Published locally only: ${publishResult.reason}`);
                } else {
                    studioSetStatus(`Local publish done, GitHub failed: ${publishResult.reason}`, true);
                }
            });

            document.getElementById('studio-download-markdown').addEventListener('click', () => {
                studioDownloadCurrentMarkdown();
            });

            document.getElementById('studio-reset-storage').addEventListener('click', () => {
                localStorage.removeItem(STUDIO_CONFIG_KEY);
                localStorage.removeItem(STUDIO_CONTENT_KEY);
                studioSetStatus('Studio data cleared. Reloading...');
                setTimeout(() => window.location.reload(), 300);
            });

            window.addEventListener('hashchange', () => {
                syncStudioRouteState();
            });
        }

        function initStudioUi() {
            if (!studioInitialized) {
                studioBindEvents();
                bindLiveEditDockEvents();
                studioInitialized = true;
            }
            // Default Studio editing mode: Visual Edit ON.
            setStudioVisualEditMode(true);
            setLiveVisualEditMode(false);
            populateGroupNameSelect(getStudioGroupNameValue());
            studioPopulateGeneralFields();
            studioPopulateLessonSelect(studioSelectedPath || getSavedLastFile() || '');
            setProjectSettingsCollapsed(getStoredBool(PROJECT_SETTINGS_COLLAPSED_KEY, true));
            syncStudioRouteState();
            updateLiveEditDockVisibility();
        }

        loadConfig();

        const fileSearchInput = document.getElementById('file-search');
        const clearSearchButton = document.getElementById('clear-search');
        if (fileSearchInput) {
            fileSearchInput.addEventListener('input', (e) => {
                filterGuideFiles(e.target.value);
            });
        }
        if (clearSearchButton && fileSearchInput) {
            clearSearchButton.addEventListener('click', () => {
                fileSearchInput.value = '';
                filterGuideFiles('');
                fileSearchInput.focus();
            });
        }

        const toggleMdFilesButton = document.getElementById('toggle-md-files');
        toggleMdFilesButton.addEventListener('click', () => {
            const sidebar = document.getElementById('sidebar');
            // toggle visual open state on button
            toggleMdFilesButton.classList.toggle('open');
            toggleMdFilesButton.setAttribute('aria-expanded', String(toggleMdFilesButton.classList.contains('open')));

            if (window.innerWidth <= 1200) {
                sidebar.classList.toggle('overlay');
                sidebar.classList.toggle('visible');
            } else {
                const nowHidden = sidebar.style.display === 'none';
                sidebar.style.display = nowHidden ? 'block' : 'none';
            }
        });

        const toggleTocButton = document.getElementById('toc-toggle');
        toggleTocButton.addEventListener('click', () => {
            const tocSidebar = document.getElementById('toc-sidebar');
            toggleTocButton.classList.toggle('open');
            toggleTocButton.setAttribute('aria-expanded', String(toggleTocButton.classList.contains('open')));
            if (window.innerWidth <= 1200) {
                tocSidebar.classList.toggle('overlay');
                tocSidebar.classList.toggle('visible');
            } else {
                tocSidebar.style.display = tocSidebar.style.display === 'none' ? 'block' : 'none';
            }
        });

// Hide TOC sidebar when clicking anywhere outside of it
        document.addEventListener('click', (event) => {
            const tocSidebar = document.getElementById('toc-sidebar');
            const toggleTocButton = document.getElementById('toc-toggle');
            const isClickInsideTocSidebar = tocSidebar.contains(event.target);
            const isClickOnToggleTocButton = toggleTocButton.contains(event.target);

            if (!isClickInsideTocSidebar && !isClickOnToggleTocButton && window.innerWidth <= 1200 && tocSidebar.classList.contains('visible')) {
                tocSidebar.classList.remove('overlay');
                tocSidebar.classList.remove('visible');
                const tocToggleBtn = document.getElementById('toc-toggle');
                if (tocToggleBtn) { tocToggleBtn.classList.remove('open'); tocToggleBtn.setAttribute('aria-expanded', 'false'); }
            }
        });

        document.getElementById('sidebar').addEventListener('click', (event) => {
        if (event.target.tagName === 'A') {
            const sidebar = document.getElementById('sidebar');
            if (window.innerWidth <= 1200 ) {
                sidebar.classList.remove('overlay');
                sidebar.classList.remove('visible');
                sidebar.style.transition = 'transform 0.9s ease';
                const mdToggleBtn = document.getElementById('toggle-md-files');
                if (mdToggleBtn) { mdToggleBtn.classList.remove('open'); mdToggleBtn.setAttribute('aria-expanded', 'false'); }
            }
        }
    });

        document.addEventListener('keydown', (e) => {
            const target = e.target;
            const isTypingField = target && (
                target.tagName === 'INPUT' ||
                target.tagName === 'TEXTAREA' ||
                target.isContentEditable
            );

            if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
                e.preventDefault();
                if (fileSearchInput) fileSearchInput.focus();
                return;
            }

            if (isTypingField) return;

            if (e.altKey && e.key === 'ArrowDown') {
                e.preventDefault();
                navigateRelativeFile(1);
            } else if (e.altKey && e.key === 'ArrowUp') {
                e.preventDefault();
                navigateRelativeFile(-1);
            }
        });

    </script>
</body>
</html>
